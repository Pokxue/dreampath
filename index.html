<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0d;
    --surface: #15151a;
    --surface-2: #1d1d24;
    --border: #2a2a33;
    --gold: #b8860b;
    --gold-soft: #e8c364;
    --gold-deep: #7a5410;
    --gold-grad: linear-gradient(135deg, #7a5410 0%, #b8860b 28%, #f3d37a 50%, #b8860b 72%, #7a5410 100%);
    --text: #f5f5f7;
    --muted: #9a9aa6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Inter", system-ui, sans-serif;
    background:
      radial-gradient(ellipse 480px 360px at 80% 8%, rgba(184, 134, 11, 0.20), transparent 70%),
      radial-gradient(ellipse 420px 320px at 4% 96%, rgba(184, 134, 11, 0.16), transparent 70%),
      radial-gradient(ellipse 300px 260px at 52% 62%, rgba(184, 134, 11, 0.12), transparent 70%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    position: relative;
    overflow-x: hidden;
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .blotch {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(184, 134, 11, 0.40), rgba(122, 84, 16, 0.18) 45%, transparent 70%);
    filter: blur(28px);
    animation: drift 14s ease-in-out infinite;
  }
  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(18px, -12px) scale(1.06); }
  }
  .star {
    position: absolute;
    color: var(--gold);
    filter: blur(1.5px);
    opacity: 0.45;
    animation: twinkle 6s ease-in-out infinite;
  }
  .star.sm { filter: blur(2px); opacity: 0.3; }
  .star.lg { filter: blur(0.5px); opacity: 0.55; }
  .star svg { width: 100%; height: 100%; display: block; }

  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.6; }
  }

  .sidebar, .main { position: relative; z-index: 1; }

  .sidebar {
    width: 240px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 28px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: sticky;
    top: 0;
    height: 100vh;
  }

  .logo {
    font-family: "Great Vibes", cursive;
    font-size: 40px;
    line-height: 1;
    background: var(--gold-grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-align: center;
    padding: 4px 0 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 10px;
    color: var(--muted);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    background: none;
    text-align: left;
    transition: background 0.2s, color 0.2s;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active {
    background: var(--surface-2);
    color: var(--gold);
    box-shadow: inset 3px 0 0 var(--gold);
  }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

  .sidebar-footer {
    margin-top: auto;
    font-size: 12px;
    color: var(--muted);
    padding: 0 14px;
  }

  .main {
    flex: 1;
    padding: 48px 56px;
    max-width: 1100px;
  }

  .header {
    margin-bottom: 40px;
  }
  .header h1 {
    font-family: "Great Vibes", cursive;
    font-weight: 400;
    font-size: 56px;
    background: var(--gold-grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1.1;
  }
  .header p {
    color: var(--muted);
    font-size: 15px;
    margin-top: 6px;
  }

  .section-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-bottom: 48px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    gap: 14px;
    text-align: left;
    color: inherit;
    font: inherit;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--gold);
    box-shadow: 0 10px 30px rgba(212, 175, 55, 0.12);
  }
  .card-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
  }
  .card-icon svg { width: 22px; height: 22px; }
  .card h3 { font-size: 18px; font-weight: 600; }
  .card p { font-size: 14px; color: var(--muted); line-height: 1.5; }

  .quick {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
  }
  .quick-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    color: var(--text);
    font: inherit;
    font-size: 15px;
    text-align: left;
    transition: border-color 0.2s;
  }
  .quick-item:hover { border-color: var(--gold); }
  .quick-item span.arrow { color: var(--muted); }

  @media (max-width: 760px) {
    body { flex-direction: column; }
    .sidebar {
      width: 100%;
      height: auto;
      position: static;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      padding: 14px 16px;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    .logo { font-size: 30px; padding: 0 12px 0 0; border-bottom: none; margin-bottom: 0; }
    .nav-item { padding: 8px 10px; font-size: 13px; }
    .sidebar-footer { display: none; }
    .main { padding: 28px 20px; }
    .header h1 { font-size: 42px; }
  }
</style>
</head>
<body>

  <div class="stars" aria-hidden="true">
    <div class="blotch" style="top:-6%; left:68%; width:340px; height:280px;"></div>
    <div class="blotch" style="top:70%; left:-4%; width:320px; height:260px; animation-delay:4s;"></div>
    <div class="blotch" style="top:40%; left:46%; width:220px; height:200px; animation-delay:8s; opacity:0.7;"></div>
    <div class="blotch" style="top:18%; left:6%; width:180px; height:160px; animation-delay:2s; opacity:0.6;"></div>
    <div class="star lg" style="top:8%; left:18%; width:44px; height:44px;">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg>
    </div>
    <div class="star" style="top:14%; left:62%; width:26px; height:26px; animation-delay:1s;">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg>
    </div>
    <div class="star sm" style="top:32%; left:44%; width:18px; height:18px; animation-delay:2s;">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg>
    </div>
    <div class="star" style="top:58%; left:82%; width:34px; height:34px; animation-delay:3s;">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg>
    </div>
    <div class="star sm" style="top:76%; left:30%; width:22px; height:22px; animation-delay:1.5s;">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg>
    </div>
    <div class="star lg" style="top:88%; left:70%; width:50px; height:50px; animation-delay:4s;">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg>
    </div>
    <div class="star sm" style="top:50%; left:8%; width:16px; height:16px; animation-delay:2.5s;">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg>
    </div>
  </div>

  <aside class="sidebar">
    <div class="logo">Dream</div>

    <button class="nav-item active" data-page="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      Home
    </button>
    <button class="nav-item" data-page="game">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="5"/><path d="M7 12h4M9 10v4M15.5 11h.01M17.5 13h.01"/></svg>
      Game Mode
    </button>
    <button class="nav-item" data-page="leaderboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
      Leaderboard
    </button>
    <button class="nav-item" data-page="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l-.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      Settings
    </button>

    <div class="sidebar-footer">Dream Path &middot; v1.0</div>
  </aside>

  <main class="main">
    <header class="header">
      <h1>Dream Path</h1>
      <p>Choose how you want to explore your future career today.</p>
    </header>

    <div class="section-label">Learning modes</div>
    <section class="cards">
      <button class="card" data-page="study">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2zM22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/><path d="M5 8h4M5 11h4M5 14h3M15 8h4M15 11h4M15 14h3"/></svg>
        </div>
        <h3>Study</h3>
        <p>Interactive notes that help you learn the theory behind each career path.</p>
      </button>

      <button class="card" data-page="quiz">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3" width="12" height="18" rx="1.5"/><path d="M5.5 8h6M5.5 11.5h6M5.5 15h3.5"/><path d="M18 4h3v13l-1.5 3-1.5-3z"/><path d="M18 7h3"/></svg>
        </div>
        <h3>Quiz</h3>
        <p>Multiple-choice theory questions to test what you have learned.</p>
      </button>

      <button class="card" data-page="simulation">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg>
        </div>
        <h3>Simulation</h3>
        <p>Short-answer case studies based on real-life career scenarios.</p>
      </button>
    </section>

    <div class="section-label">Quick access</div>
    <section class="quick">
      <button class="quick-item" data-page="explore">Explore career paths <span class="arrow">&rsaquo;</span></button>
      <button class="quick-item" data-page="profile">Take the personality test <span class="arrow">&rsaquo;</span></button>
      <button class="quick-item" data-page="daily">Daily challenge <span class="arrow">&rsaquo;</span></button>
    </section>
  </main>

<script>
  const navItems = document.querySelectorAll('.nav-item');
  navItems.forEach(item => {
    item.addEventListener('click', () => {
      navItems.forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      console.log('Navigate to:', item.dataset.page);
    });
  });

  document.querySelectorAll('.card, .quick-item').forEach(el => {
    el.addEventListener('click', () => {
      console.log('Navigate to:', el.dataset.page);
    });
  });
</script>
</body>
</html>
