<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamPath - Supreme Black & Gold AI Career Intelligence</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: '#050508',
                        surface: '#0E0E12',
                        gold: {
                            light: '#F3E5AB',
                            DEFAULT: '#D4AF37',
                            bright: '#FFD700',
                            dark: '#9A7B2C'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'spin-slow': 'spin 22s linear infinite',
                        'spin-reverse': 'spin-reverse 28s linear infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'glow': 'glow 3s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-12px)' },
                        },
                        'spin-reverse': {
                            '0%': { transform: 'rotate(360deg)' },
                            '100%': { transform: 'rotate(0deg)' }
                        },
                        glow: {
                            '0%': { filter: 'drop-shadow(0 0 10px rgba(255, 215, 0, 0.4))' },
                            '100%': { filter: 'drop-shadow(0 0 30px rgba(255, 215, 0, 0.8))' }
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050508;
            color: #E2D9C5;
            overflow-x: hidden;
        }

        /* 顶级黑金玻璃卡片 */
        .glass-card {
            background: rgba(14, 14, 18, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.22);
        }

        .glass-card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card-hover:hover {
            border-color: rgba(255, 215, 0, 0.5);
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.18);
            transform: translateY(-3px);
        }

        /* 金色渐变文字 */
        .gold-gradient-text {
            background: linear-gradient(135deg, #FFF 0%, #FFD700 40%, #D4AF37 70%, #9A7B2C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 黄金按钮 */
        .gold-btn {
            background: linear-gradient(135deg, #FFD700 0%, #D4AF37 100%);
            color: #050508;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        .gold-btn:hover {
            background: linear-gradient(135deg, #FFFFFF 0%, #FFD700 100%);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
            transform: translateY(-2px);
        }

        .gold-btn-outline {
            border: 1px solid rgba(212, 175, 55, 0.4);
            background: rgba(212, 175, 55, 0.05);
            color: #FFD700;
            transition: all 0.3s ease;
        }
        .gold-btn-outline:hover {
            border-color: #FFD700;
            background: rgba(212, 175, 55, 0.2);
            color: #FFFFFF;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.25);
        }

        /* 细金粉星空背景 */
        .star-bg {
            background-image: 
                radial-gradient(2px 2px at 20px 30px, rgba(255, 215, 0, 0.7), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 100px 80px, rgba(212, 175, 55, 0.5), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 180px 140px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 240px 220px, rgba(255, 215, 0, 0.4), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 320px 320px;
        }

        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            height: 6px;
            border-radius: 3px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #FFD700;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            transition: transform 0.1s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #050508;
        }
        ::-webkit-scrollbar-thumb {
            background: #1E1E26;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #D4AF37;
        }
    </style>
</head>
